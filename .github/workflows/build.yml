name: Build and Verify

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Maven build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/sports_events
          DB_USERNAME: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci-only-secret-value-must-be-at-least-32-bytes-long
        run: mvn --batch-mode --no-transfer-progress clean verify


  migration:
    name: Validate additive MySQL migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sports_events
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
      - name: Create isolated baseline schema
        run: mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events < docs/deployment/01_schema.sql
      - name: Apply additive migrations
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events < backend/src/main/resources/db/migration/V1__campus_track_meet_additive.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events < backend/src/main/resources/db/migration/V2__registration_compatibility_and_relay_config.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events < backend/src/main/resources/db/migration/V3__competition_operations.sql

      - name: Seed and verify personal check-in demo data
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events < docs/deployment/03_demo_seed.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM schedule_entry se JOIN registration r ON r.id=se.registration_id JOIN sys_user u ON u.id=r.user_id JOIN checkin_record cr ON cr.schedule_entry_id=se.id WHERE u.username='student_demo' AND cr.status='PENDING' AND se.is_deleted=0" | grep -qx 1
      - name: Verify required schema
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='sports_events' AND TABLE_NAME='event' AND COLUMN_NAME='max_items_per_user'" | grep -qx 1
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='sports_events' AND TABLE_NAME='sport_item' AND COLUMN_NAME IN ('current_participants','is_relay','relay_member_count','relay_reserve_count')" | grep -qx 4
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='sports_events' AND TABLE_NAME IN ('relay_team','relay_team_member','schedule_entry','checkin_record','field_attempt','scoring_rule','result_audit_log')" | grep -qx 7
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='sports_events' AND TABLE_NAME='result' AND COLUMN_NAME IN ('relay_team_id','result_status','review_status','review_by','review_time','review_remark','is_published','published_by','published_at')" | grep -qx 9
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot sports_events -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='sports_events' AND TABLE_NAME='schedule' AND COLUMN_NAME='round_type'" | grep -qx 1

  container-build:
    name: Validate deployment container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -f backend/Dockerfile -t campus-meet-backend:ci backend
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile -t campus-meet-frontend:ci frontend

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build:check
