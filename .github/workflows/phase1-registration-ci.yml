name: Phase 1 Registration CI

on:
  push:
    branches:
      - feat/phase1-registration-model
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/04-DB/migrations/**'
      - '.github/workflows/phase1-registration-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and run tests
        run: mvn -B -f backend/pom.xml test

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and production build
        working-directory: frontend
        run: npm run build:check

  migration-safety:
    name: Migration safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure incremental migration does not drop tables or truncate data
        run: |
          if grep -Eiq '^[[:space:]]*(DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE)' docs/04-DB/migrations/V001__phase1_registration_model.sql; then
            echo "Unsafe destructive SQL found in incremental migration."
            exit 1
          fi
          if grep -Ev '^[[:space:]]*(--|$)' backend/src/main/resources/db/data.sql; then
            echo "Deprecated seed SQL must remain non-executable."
            exit 1
          fi
