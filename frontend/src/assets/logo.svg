<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67c23a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  <!-- 跑道 -->
  <ellipse cx="100" cy="110" rx="60" ry="35" fill="none" stroke="#fff" stroke-width="6"/>
  <ellipse cx="100" cy="110" rx="45" ry="25" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- 运动员剪影 -->
  <g fill="#fff">
    <!-- 头 -->
    <circle cx="85" cy="60" r="12"/>
    <!-- 身体 -->
    <path d="M85 72 L85 100 L70 130 M85 100 L100 130 M85 85 L65 100 M85 85 L105 75"/>
  </g>
  <!-- 奖杯 -->
  <g transform="translate(130, 50)">
    <path d="M0 0 L30 0 L25 25 L5 25 Z" fill="#ffd700"/>
    <rect x="10" y="25" width="10" height="10" fill="#ffd700"/>
    <rect x="5" y="35" width="20" height="5" fill="#ffd700"/>
  </g>
  <!-- 文字 -->
  <text x="100" y="175" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">SPORTS</text>
  <text x="100" y="175" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">SPORTS</text>
